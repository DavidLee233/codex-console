{% if project_notice %}
{% set github_href = project_notice.get('github_repo_url', 'https://github.com/DavidLee233/codex-console') %}
<div class="site-notice-wrapper">
    <div class="container">
        <section class="site-notice" role="note" aria-label="{{ project_notice.get('title', '免责声明') }}">
            <div class="site-notice-heading">
                <strong>{{ project_notice.get('title', '免责声明') }}</strong>
            </div>
            <p class="site-notice-text">{{ project_notice.get('disclaimer', '') }}</p>
            <div class="site-notice-links">
                <a class="site-notice-link" href="{{ github_href }}" data-external-url="{{ github_href }}" rel="noopener noreferrer" onclick="event.preventDefault(); event.stopPropagation(); window.open(this.getAttribute('data-external-url') || this.href, '_blank', 'noopener,noreferrer'); return false;">
                    <span class="site-notice-link-title">GitHub 仓库</span>
                    <span class="site-notice-link-meta">{{ github_href }}</span>
                </a>
            </div>
        </section>
    </div>
</div>
{% endif %}
